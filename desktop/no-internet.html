<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <title>სასწავლო პორტალი</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0c1c2e;
        color: #fff;
        font-family: "BPG Glaho", "Sylfaen", "Noto Sans Georgian", system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #ffffffb0;
        font-size: 16px;
      }
      i {
        display: block;
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #f2bf4a, transparent);
        background-size: 50% 100%;
        background-repeat: no-repeat;
        animation: run 1.3s ease-in-out infinite;
      }
      a {
        margin-top: 10px;
        padding: 12px 26px;
        background: #f2bf4a;
        color: #0c1c2e;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
      }
      @keyframes run {
        from {
          background-position: -60% 0;
        }
        to {
          background-position: 160% 0;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 512 512" width="112" height="112" aria-hidden="true"><defs>

    <p>ერთხელ შესვლის შემდეგ პროგრამა 30 დღე ინტერნეტის გარეშეც იმუშავებს.</p>
